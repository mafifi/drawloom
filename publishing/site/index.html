<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Drawloom. Articles, ideas and work in progress. Coming soon.">
    <title>Drawloom — Coming soon</title>
    <style>
      :root {color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #111; background: #fff;}
      * {box-sizing: border-box;}
      body {margin: 0; min-height: 100svh; display: flex; flex-direction: column;}
      header {margin: 0 24px; padding: 24px 20px; border-bottom: 2px solid #1447e6;}
      .wordmark {font: bold 32px Georgia, serif;}
      main {width: 100%; max-width: 1060px; margin: auto; padding: 80px 30px;}
      h1 {font: bold clamp(46px, 8vw, 80px)/1.08 Georgia, serif; letter-spacing: -.035em; margin: 0 0 24px;}
      p {color: #5b5d67; font-size: 20px; line-height: 1.6; margin: 0 0 32px;}
      a {color: #1447e6; font-size: 18px; text-underline-offset: .22em;}
      a:focus-visible {outline: 3px solid #1447e6; outline-offset: 6px;}
      @media (max-width: 600px) {header {margin: 0 20px; padding: 20px 0;} main {padding: 60px 24px;} .wordmark {font-size: 27px;}}
    </style>
  </head>
  <body>
    <header><span class="wordmark">Drawloom</span></header>
    <main>
      <h1>Coming soon.</h1>
      <p>Articles, ideas and work in progress. Stay tuned.</p>
      <a href="https://github.com/mafifi/drawloom">Follow Drawloom on GitHub</a>
    </main>
  </body>
</html>
