svg .semantic-sigil {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.76;
      pointer-events: none;
    }
svg .semantic-sigil > * { vector-effect: non-scaling-stroke; }
svg .semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }
svg .s-frontend { color: var(--frontend-stroke); }
