  --panel-border: #536b60;
  --lane-fill: transparent;
  --lane-stroke: #536b60;
  --arrow: #bdcdc5;
  --arrow-emphasis: #a5d4bf;
  --journal-accent: #a5d4bf;
  --toolbar-bg: #17231f;
  --toolbar-border: #536b60;
  --toolbar-text: #f8f8f6;
  --toolbar-hover: #21392e;
  --toolbar-menu-bg: #17231f;
}
[data-theme][data-preset] {
  --grid: transparent;
  --frontend-fill: var(--panel);
  --backend-fill: var(--panel);
  --database-fill: var(--panel);
  --cloud-fill: var(--panel);
  --security-fill: var(--panel);
  --messagebus-fill: var(--panel);
  --external-fill: var(--panel);
  --frontend-stroke: var(--journal-accent);
  --backend-stroke: var(--journal-accent);
  --database-stroke: var(--journal-accent);
  --cloud-stroke: var(--journal-accent);
  --security-stroke: var(--journal-accent);
  --messagebus-stroke: var(--journal-accent);
  --external-stroke: var(--text-muted);
}
/* Archify's region tint is a literal amber value, not a theme variable. */
[data-theme][data-preset] .c-region { fill: transparent; }

