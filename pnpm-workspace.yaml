# Workspace layout and dependency catalogs.
# Catalog syntax is unchanged from the previous Bun catalog.

packages:
  - "apps/*"
  - "packages/*/*"

# Build scripts are opt-in and this block is maintained by `pnpm approve-builds`.
# Only tooling Drawloom actually executes may run one: esbuild supplies the
# bundler binary, Playwright the browser used by the UI check. The rest are
# denied until something demonstrably needs them.
allowBuilds:
  '@microsoft/aspire-cli': false
  '@playwright/browser-chromium': true
  '@swc/core': false
  autoevals: false
  braintrust: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false

