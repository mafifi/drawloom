name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Bun version
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up Node consumer runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical checks
        run: bun run check:ci

      - name: Install pinned browser for public UI acceptance
        run: bunx --no-install playwright install --with-deps chromium

      - name: Verify public synthetic browser acceptance
        run: bun run test:ui

      - name: Select publication changes
        id: publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --no-renames --name-only -z "$BEFORE" "$GITHUB_SHA" | bun scripts/publishing-scope.ts >> "$GITHUB_OUTPUT"
          fi

  learning-integration:
    name: Learning recovery (Temporal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pinned Bun version
        uses: oven-sh/setup-bun@v2.2.0
      - name: Set up knowledge runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Install verified Temporal CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/drawloom-temporal-cli"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl --fail --location --retry 3 --output temporal.tar.gz https://github.com/temporalio/cli/releases/download/v1.3.0/temporal_cli_1.3.0_linux_amd64.tar.gz
          echo 'ca03976fb948b7084f4075dab55afb65915713498577ea68b483a14e3dfcd74e  temporal.tar.gz' | sha256sum --check --strict
          tar -xzf temporal.tar.gz temporal
          ./temporal --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Build supported packages
        run: bun run build:packages
      - name: Verify real service recovery
        # Each test owns an isolated service and closes it in finally.
        run: bun run test:temporal
      - name: Verify learning orchestration recovery (Temporal-backed)
        run: bun run test:orchestration:learning

  publish:
    needs: [check, learning-integration]
    if: github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publishing.yml
