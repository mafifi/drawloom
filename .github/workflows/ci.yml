name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Bun version
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up Node consumer runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical checks
        run: bun run check:ci

      - name: Select publication changes
        id: publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --no-renames --name-only -z "$BEFORE" "$GITHUB_SHA" | bun scripts/publishing-scope.ts >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publishing.yml
