name: Publishing

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: publishing-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned pnpm version
        uses: pnpm/action-setup@v4
      - name: Set up pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run journal:render:article
      - run: pnpm run journal:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publishing/site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy journal
        id: deployment
        uses: actions/deploy-pages@v4
