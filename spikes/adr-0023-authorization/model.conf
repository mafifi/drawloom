[request_definition]
r = sub, obj, act, env
[policy_definition]
p = unused
[policy_effect]
e = some(where (p.eft == allow))
[matchers]
m = r.sub.active && r.obj.active && r.sub.tenant == r.obj.tenant && r.sub.clearance >= r.obj.sensitivity && containsAll(r.sub.compartments, r.obj.compartments) && r.env.now < r.obj.expires && (r.act == "read" || r.act == "derive" || (r.act == "export_model" && r.obj.remoteAllowed))
